[project]
name="linkShortcutFileFormat"
version="1.0.0.0"
description = "File format for windows .lnk shortcuts"
readme="README.md"
requires-python = ">= 3.9"
dependencies = [
    "paths @ git+https://github.com/TheHeadlessSourceMan/paths.git",
]
authors = [{name = "KC Eilander"}]
license = "MIT"
license-files = ["LICENSE"]
keywords=[]

[tool.setuptools.package-dir]
linkShortcutFileFormat = "."

[project.urls]
Homepage = "https://github.com/TheHeadlessSourceMan/linkShortcutFileFormat"

[project.entry-points."pyFormatGenie.plugin"]
linkShortcutFileFormat='filetypePlugin:FiletypePlugin'
